name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ocr-service:
    name: OCR service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        # PaddleOCR is stubbed in tests, so the heavy wheels aren't needed here.
        run: pip install fastapi==0.115.6 pydantic==2.10.4 pytest==8.3.4 httpx==0.28.1 python-multipart==0.0.20
      - run: pytest medical-ocr-platform/ocr-service/tests -q

  backend:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify
        working-directory: medical-ocr-platform/backend

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [ocr-service, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t medical-ocr-api ./medical-ocr-platform/backend
      - run: docker build -t medical-ocr-service ./medical-ocr-platform/ocr-service