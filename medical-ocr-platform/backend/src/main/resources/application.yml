server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: medical-ocr-app

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/medical_ocr}
      auto-index-creation: true

  servlet:
    multipart:
      # These are the limits Spring actually enforces. The old config declared
      # file.upload.max-size: 10MB, which nothing read — so the real ceiling was
      # Spring's 1MB default and every larger upload failed with a confusing error.
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:12MB}
      file-size-threshold: 2MB

jwt:
  # No default. JwtTokenProvider refuses to start without this, and refuses the
  # placeholder that used to be committed here.
  #   openssl rand -base64 48
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}   # 24 hours

ocr:
  service:
    url: ${OCR_SERVICE_URL:http://localhost:8000/ocr}
    token: ${OCR_SERVICE_TOKEN:}
    timeout-seconds: ${OCR_TIMEOUT_SECONDS:120}

  # Worker pool for the async read. Keep max-size at or below the OCR service's
  # own concurrency — the Python side serialises inference behind a lock, so
  # more threads here only deepens the queue without reading anything faster.
  executor:
    core-size: ${OCR_POOL_CORE:2}
    max-size: ${OCR_POOL_MAX:4}
    queue-capacity: ${OCR_POOL_QUEUE:50}

file:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-bytes: ${UPLOAD_MAX_BYTES:10485760}

cors:
  # Comma-separated. Add your deployed frontend origin here.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.medicalocr: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
