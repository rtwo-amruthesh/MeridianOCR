services:

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-medicalocr}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
      MONGO_INITDB_DATABASE: medical_ocr
    volumes:
      - mongo-data:/data/db
    # Not published to the host: only the API needs to reach it.
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ocr-service:
    build: ./ocr-service
    restart: unless-stopped
    environment:
      OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN:?set OCR_SERVICE_TOKEN in .env}
      OCR_LANG: ${OCR_LANG:-en}
      OCR_MAX_BYTES: 10485760
      OCR_PDF_DPI: 200
    # Reachable only from the compose network. This service has no user auth
    # and must never be exposed directly.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 120s   # model weights load on first use
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      ocr-service:
        condition: service_started
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-medicalocr}:${MONGO_PASSWORD}@mongo:27017/medical_ocr?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — openssl rand -base64 48}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      OCR_SERVICE_URL: http://ocr-service:8000/ocr
      OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      UPLOAD_DIR: /app/uploads
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads

  # Optional: serves the static frontend next to the API during local work.
  # Point it at ../medical-ocr-web, or drop this service and use Netlify.
  web:
    image: nginx:alpine
    profiles: ["with-web"]
    ports:
      - "${WEB_PORT:-5173}:80"
    volumes:
      - ../medical-ocr-web:/usr/share/nginx/html:ro

volumes:
  mongo-data:
  uploads:
